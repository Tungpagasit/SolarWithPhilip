<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form registry</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<!-- Registers internal notification forms with Netlify Forms. Submissions come from server-side functions only. Recipients are configured in the Netlify dashboard. -->
<form name="swp-new-lead" method="POST" data-netlify="true" hidden>
<input type="hidden" name="form-name" value="swp-new-lead">
<input type="text" name="subject"><input type="text" name="name"><input type="text" name="preferred_contact"><input type="text" name="phone"><input type="text" name="email"><input type="text" name="zip"><input type="text" name="primary_goal"><input type="text" name="utility"><input type="text" name="electricity_bill_range"><input type="text" name="existing_quote"><input type="text" name="review_concern"><input type="text" name="property_address"><textarea name="message"></textarea><input type="text" name="quote_uploaded"><input type="text" name="bill_uploaded"><input type="text" name="upload_note"><input type="text" name="intake_id"><input type="text" name="submitted_at"><input type="text" name="lead_type"><input type="text" name="form_source"><input type="text" name="source_page"><input type="text" name="conversion_page"><input type="text" name="lead_status">
</form>
<form name="swp-document-added" method="POST" data-netlify="true" hidden>
<input type="hidden" name="form-name" value="swp-document-added">
<input type="text" name="subject"><input type="text" name="intake_id"><input type="text" name="name"><input type="text" name="email"><input type="text" name="phone"><input type="text" name="zip"><input type="text" name="document_type"><input type="text" name="uploaded_at"><input type="text" name="download_solar_proposal"><input type="text" name="download_electric_bill"><input type="text" name="link_note">
</form>
</body>
</html>

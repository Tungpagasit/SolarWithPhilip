[build]
  publish = "."
  functions = "proposal/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Private development paths: never serve SQL migrations or build/test scripts publicly.
[[redirects]]
  from = "/db/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
